---
layout: default
---

<style>
  .post-header-logo {
    margin-bottom: 0.5rem;
  }

  .post-header-logo img {
    height: 3rem;
    width: auto;
  }

  .post-date-in-header {
    color: #999;
    font-size: 0.85rem;
    font-weight: 400;
    margin-top: 0.5rem;
  }
</style>

<!-- The header is layout-owned and carries nothing post-specific: the image comes
     from the post's `header_image` front matter, and a post without one gets just
     the title and the date. Rendered with Liquid rather than injected on
     DOMContentLoaded, so crawlers and non-JS readers see the date and there is no
     layout shift. -->
<div class="page-header">
  {% if page.header_image %}
  <div class="post-header-logo">
    <img src="{{ page.header_image }}" alt="{{ page.header_image_alt }}">
  </div>
  {% endif %}
  <h1 class="page-title">{{ page.title }}</h1>
  <div class="post-date-in-header">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </div>
</div>

{{ content }}

<div class="container">
  <div class="post-social">{% include follow-links.html %}</div>

  {% if page.comments %}
  <div class="comments-section">
    <div id="disqus_thread"></div>
    <!-- Disqus sets tracking cookies, so it must not load until the visitor
         asks for it ("two-click" pattern) — the click is the consent. -->
    <button id="load-comments" class="load-comments" type="button">💬 Load comments</button>
    <p class="comments-privacy-note">
      Comments are provided by Disqus, a third-party service, and load only when you request them.
    </p>
    <script>
      var disqus_config = function () {
        this.page.url = '{{ site.url }}{{ page.url }}';
        this.page.identifier = '{{ page.id | default: page.url }}';
      };
      document.getElementById('load-comments').addEventListener('click', function () {
        var d = document,
          s = d.createElement('script');
        s.src = 'https://https-aistomin-com.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
        this.style.display = 'none';
        d.querySelector('.comments-privacy-note').style.display = 'none';
      });
    </script>
    <noscript>
      Please enable JavaScript to view the
      <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>
    </noscript>
  </div>
  {% endif %}
</div>
